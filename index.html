:100%"><button class="candidate selected" onclick="document.getElementById('reviewvalue').value='${r.proposal}'"><b>✓ ${r.proposal}</b><div class="muted small">${r.type==='Confirm identity'?'Matches Ms. Hart’s classroom roster':'Suggested next step'}</div></button><div class="notice">${r.type==='Consent change'?'The hold remains until a documented decision is made.':'Your confirmation is recorded with your name and time.'}</div></div></div><div class="reviewfoot">${btn('Leave for later','skipReview()')}${btn(r.type==='Filing failed'?'Simulate retry':'Confirm & next →','resolveReview()','primary')}</div></section></div>`}

e es una opción.'),`<p>${tr('Ask your school office for a printed Tooth BUDDS consent form. Complete both sides, sign it, and return it to your child’s teacher.','Pida un formulario impreso de consentimiento de Tooth BUDDS en la oficina escolar. Complete ambos lados, fírmelo y devuélvalo al maestro de su hijo/a.')}</p>`,btn(tr('Got it','Entendido'),'closeModal()','primary'))}function downloadParent(){download('tooth-budds-demo-consent.txt','DEMONSTRATION ONLY — NOT A VALID CONSENT\n'+JSON.stringify(state.parent,null,2));toast(tr('Demo summary downloaded.','Resumen de prueba descargado.'))}

/* 2 Insurance */
function insuranceTab(){const need=children.filter(c=>c.ins==='purple');return `<div class="notice">Every child is looked up, whatever the form says. The colours are the ones you already use in Tab32.</div><div class="keyrow">${Object.keys(INS).map(insBadge).join('')}</div><section class="panel"><div class="tablewrap"><table><thead><tr><th>Child</th><th>Form says</th><th>Insurance status</th><th></th></tr></thead><tbody>${children.map((c,i)=>`<tr><td><strong>${c.name}</strong><div class="muted small">${c.dob}</div></td><td>${c.says}</td><td>${insBadge(c.ins)}</td><td>${btn('Change',`openEligibility(${i})`,'small')}</td></tr>`).join('')}</tbody></table></div></section><section class="panel" style="margin-top:22px">${panelhead('Birthdays to get from the school',btn('Print list','window.print()','small'))}<div class="pad" style="padding-top:0"><p class="muted small">These children could not be found with the birthday on the form. Take this list to the school office.</p>${need.map(c=>`<div class="checkline">${insBadge('purple').replace(INS.purple[1],c.name)}<span class="muted small">${c.teacher} · form says ${c.dob}</span></div>`).join('')||'<p class="small" style="margin-top:14px">Nothing to collect right now.</p>'}</div></section>`}
openEligibility=function(i){modal('Insurance status',`<h3>${children[i].name}</h3><p class="muted small">${children[i].dob} · Pima Elementary</p><label style="margin-top:20px" for="eligresult">Status</label><select id="eligresult" style="width:100%">${Object.keys(INS).map(k=>`<option value="${k}" ${children[i].ins===k?'selected':''}>${INS[k][1]}</option>`).join('')}</select><div class="notice" style="margin-top:20px">In the real app this is filled in for you from the AHCCCS lookup. You only step in when a child can’t be found.</div>`,btn('Save',`setIns(${i},document.getElementById('eligresult').value)`,'primary'))};
function setIns(i,k){children[i].ins=k;children[i].coverage=INS[k][1];closeModal();render();toast('Insurance status saved in the demo.')}

/* 3 Documents */
function docRows(only){return children.flatMap((c,i)=>[[c,i,'c','Consent',i%2?'Phone form':'Paper scan'],...(i%3===0?[[c,i,'r','Referral','Paper scan']]:[])]).filter(r=>only===undefined||r[1]===only)}
function documentsTab(){return `<div class="notice">Consents and referrals are kept here, not in OneDrive. Each one is named and filed to the child’s Tab32 chart for you.</div><div class="split" style="margin-bottom:20px"><p class="muted">One big scan in. Split, named, matched and filed.</p>${btn(icons.upload+'Add scans','openUpload()','primary')}</div><section class="panel"><div class="tablewrap"><table><thead><tr><th>File</th><th>Type</th><th>Came from</th><th>Tab32 chart</th><th></th></tr></thead><tbody>${docRows().map(([c,i,t,type,src])=>`<tr><td><strong>${c.name} ${t}2026.pdf</strong><div class="muted small">${c.teacher}</div></td><td>${type}</td><td>${src}</td><td>${badge(c.file,c.file.startsWith('System')?'blue':'')}</td><td>${btn('View',`openDocument(${i})`,'small')}</td></tr>`).join('')}</tbody></table></div></section>`}
processUpload=function(){state.uploaded=true;const ref=document.getElementById('scantype').value.startsWith('Referral');document.getElementById('uploadresult').innerHTML=`<div class="notice" style="margin-top:20px;display:block"><b>✓ Sample scan processed</b><br>${ref?'28 pages → 14 referral sheets. Each one split, named “Name r2026”, matched to today’s visit list and filed. 1 needs a look.':'38 pages → 19 consent forms, front and back kept together. Each one split, named “Name c2026”, matched to a child and filed. 2 need a look, 1 has no signature.'}<br><span class="muted">No more splitting pages by hand. This is a simulation.</span></div>`;toast('Sample batch processed. No files were uploaded.')};
const _schoolTab=schoolTab;
schoolTab=function(){if(state.school!==2&&state.tab==='eligibility')return insuranceTab();if(state.school!==2&&state.tab==='documents')return documentsTab();return _schoolTab()};

/* 1 Child record: no service recording here */
openChild=function(i){const c=children[i];const blocked=c.status!=='Ready';const seen=state.seen.includes(i);modal(c.name,`<div class="details"><div class="detail">Birthday<b>${c.dob}</b></div><div class="detail">Classroom<b>${c.teacher} · Grade ${c.grade}</b></div><div class="detail">Patient reference<b>DEMO-${1001+i}</b></div><div class="detail">Readiness<b>${badge(seen?'Seen':c.status,blocked?'red':'blue')}</b></div></div>${blocked?`<div class="notice red">! Not ready: ${c.status==='On hold'?'A permission change is awaiting review.':c.status==='No signature'?'A signed form is required.':'Identity or form answers need confirmation.'}</div>`:''}<h3>Permission for this visit</h3><div class="perms">${['Screening','Cleaning','Fluoride','Sealants','SDF','S.M.A.R.T.'].map(s=>`<div class="perm ${s==='Fluoride'&&c.status==='On hold'?'hold':c.services.includes(s)?'':'no'}"><span>${s}</span><b>${s==='Fluoride'&&c.status==='On hold'?'! On hold':c.services.includes(s)?'✓ Allowed':'— Not selected'}</b></div>`).join('')}</div><h3 style="margin-bottom:12px">Read the parent’s own marks</h3>${sourceCard(c)}<label class="checkline"><input type="checkbox" ${state.checked.includes(i)?'checked':''} ${blocked?'disabled':''} onchange="checkChild2(${i},this.checked)">I checked the consent, signature and health information.</label><h3 style="margin:14px 0 10px">Insurance</h3>${insBadge(c.ins)}<h3 style="margin:24px 0 4px">Documents</h3>${docRows(i).map(([c,i,t,type])=>`<div class="healthrow"><span><b>${c.name} ${t}2026.pdf</b><div class="muted small">${type} · ${esc(c.file)}</div></span>${btn('View',`openDocument(${i})`,'small')}</div>`).join('')}`,`<div class="split"><span class="small muted">${seen?'✓ Seen · services charted in Tab32':'Services are charted in Tab32, the same as today.'}</span>${btn('Close','closeModal()','primary')}</div>`,true)};
function checkChild2(i,on){if(on&&!state.checked.includes(i))state.checked.push(i);if(!on)state.checked=state.checked.filter(x=>x!==i);if(on)toast('Checked. Recorded with your name and the time.')}

/* 4 Money */
const payKids=[['Oct 20','Avery Ellis','Pima','DentaQuest',161.24],['Oct 20','Noah Bennett','Pima','UnitedHealthcare',78.41],['Oct 22','Isla Hayes','Pima','Envolve Dental',149.20],['Oct 26','Owen Cole','Pima','DentaQuest',173.44],['Oct 27','Sofia Reed','Roosevelt','Health Choice',null],['Oct 27','Maya Brooks','Roosevelt','Liberty Dental',null]];
let lastPay=0;
openPayment=function(i){lastPay=i;const r=moneyRows[i];modal(r[0]+' · commission',`<div class="stats" style="grid-template-columns:1fr 1fr">${stat('Paid to Tooth BUDDS',currency(r[1]),'Nov 1–14 · for '+r[0]+'’s visits')}${stat('Commission',currency(r[2]),'10% flat rate')}</div><div class="split" style="margin-bottom:10px"><h3>Child by child</h3><span class="muted small">Showing 6 of ${[41,34,28,20][i]}</span></div><div class="tablewrap"><table><thead><tr><th>Seen</th><th>Child</th><th>Paid</th><th>10%</th><th></th></tr></thead><tbody>${payKids.map((k,j)=>`<tr><td>${k[0]}</td><td><strong>${k[1]}</strong><div class="muted small">${k[2]} · ${k[3]}</div></td><td>${k[4]===null?'<span class="dotb"><i style="background:#e3b400"></i>Billed · not paid yet</span>':currency(k[4])}</td><td>${k[4]===null?'—':currency(k[4]*.1)}</td><td>${k[4]===null?'':btn('Slip',`openSlip(${j})`,'small')}</td></tr>`).join('')}</tbody></table></div><div class="notice" style="margin-top:18px">A hygienist sees only this page, for their own name. A child who hasn’t been paid for yet stays on the list as “not paid yet”, so nobody has to ask where Johnny went.</div>`,btn('Done','closeModal()','primary'),true)};
function openSlip(j){const k=payKids[j];modal('Payment slip · '+k[1],`<p class="muted small">Only this child’s lines from the ${k[3]} payment report.</p><div class="slip" style="margin-top:14px">${k[3].toUpperCase()} · SAMPLE REMITTANCE<br>Patient: ${k[1]} · Seen ${k[0]}, 2026<br>————————————————————<br>D0191 Assessment of a patient<br>D1120 Prophylaxis, child<br>D1206 Fluoride varnish<br>————————————————————<br><b>Paid: ${currency(k[4])}</b></div><div class="notice" style="margin-top:18px">Made-up figures. No real payment report is shown.</div>`,btn('← Back to the list',`openPayment(${lastPay})`,'primary'))}
function openRemit(){modal('Add a payment report',`<p class="muted">Download the report from the payer’s website as you do now, then drop it here. The app reads each child’s line, matches it to the visit and the hygienist, and does the sums.</p><label style="margin-top:18px" for="remitpayer">Payer</label><select id="remitpayer" style="width:100%">${['DentaQuest','UnitedHealthcare','Envolve Dental','Health Choice','Liberty Dental','Other'].map(p=>`<option>${p}</option>`).join('')}</select><div class="uploadbox"><div style="font-size:30px;color:var(--blue)">↑</div><h3>Try a sample payment report</h3><p class="muted small">PDF or CSV · made-up data · no upload needed</p></div><div id="remitresult"></div>`,btn('Read sample report','processRemit()','primary'))}
function processRemit(){document.getElementById('remitresult').innerHTML=`<div class="notice" style="display:block"><b>✓ ${esc(document.getElementById('remitpayer').value)} · 14 children on this report</b><br>13 matched to a visit and a hygienist. 1 could not be matched and is waiting in Needs a look.<br>$1,612.40 added to the Nov 1–14 period. <span class="muted">Simulation only.</span></div>`;toast('Sample payment report read. Nothing was uploaded.')}
function exportQB(){download('tooth-budds-demo-quickbooks.csv','Date,Payer,Deposit,Memo\n2026-11-03,DentaQuest,4280.00,Demo batch\n2026-11-05,UnitedHealthcare,3560.00,Demo batch\n2026-11-07,Envolve Dental,2940.00,Demo batch\n2026-11-10,Health Choice,2060.00,Demo batch','text/csv');toast('Demo QuickBooks file downloaded.')}
const missed={missed:['Seen, but no claim sent yet','These children have a completed visit in Tab32 and no claim.',[['Jordan Avila','Pima · Oct 27 · Tia'],['Riley Stone','Roosevelt · Oct 27 · Heatherann'],['Casey Lund','Roosevelt · Oct 28 · Heatherann']]],waiting:['Claim sent, waiting for payment','Nothing to do yet. They stay here until a payment report includes them.',[['Sofia Reed','Health Choice · sent Oct 28'],['Maya Brooks','Liberty Dental · sent Oct 28'],['and 10 more','Oldest sent Oct 14']]],provider:['Claim shows the wrong hygienist','Tab32 put your name on these claims. The visit shows someone else saw the child.',[['Owen Cole','Claim says MiQuel · visit says Karen'],['Isla Hayes','Claim says MiQuel · visit says Tia']]],refresh:['Insurance added after the visit','Tab32 will not pick this claim up until the insurance is refreshed and saved.',[['Eli Parker','Insurance found Nov 9 · visit was Oct 27']]]};
function openMissed(k){const m=missed[k];modal(m[0],`<p class="muted">${m[1]}</p>${m[2].map(r=>`<div class="task" style="padding-left:0;padding-right:0"><span class="dot ${k==='waiting'?'':'red'}"></span><div class="grow"><h3>${r[0]}</h3><p class="muted small">${r[1]}</p></div></div>`).join('')}<div class="notice" style="margin-top:16px">Made-up examples. In the real app each line opens the child and shows where the information came from.</div>`,btn('Done','closeModal()','primary'))}
function nothingMissed(){return `<section class="panel" style="margin-bottom:24px">${panelhead('Nothing missed',`<div class="actions">${btn(icons.upload+'Add payment report','openRemit()','small')}${btn('QuickBooks export','exportQB()','small')}</div>`)}<div class="pad" style="padding-top:0"><p class="muted small" style="margin-bottom:8px">Every child seen is followed from visit to claim to payment, so you don’t have to tick names off a list.</p>${[[3,'missed'],[12,'waiting'],[2,'provider'],[1,'refresh']].map(([n,k])=>`<div class="task" style="padding-left:0;padding-right:0"><span class="dot ${k==='waiting'?'':'red'}"></span><div class="grow"><h3>${n} · ${missed[k][0]}</h3></div><button aria-label="Open list" onclick="openMissed('${k}')">→</button></div>`).join('')}</div></section>`}
const _moneyPage=moneyPage;
moneyPage=function(){const h=_moneyPage(),mark='<section class="panel"><div class="panelhead"><h2>Claims needing follow-up';return h.includes(mark)?h.replace(mark,nothingMissed()+mark):h+nothingMissed()};
const _today=today;
today=function(){const h=_today();if(state.role!=='Field')return h;return h.replace('<p class="footnote">',`<section class="panel" style="margin-top:24px">${panelhead('My commission',badge('Nov 1–14','blue'))}<div class="pad" style="padding-top:0"><div class="split"><div><h1 style="margin:0">${currency(moneyRows[0][2])}</h1><p class="muted small">10% of ${currency(moneyRows[0][1])} paid for children you saw</p></div>${btn('See child by child','openPayment(0)','primary')}</div></div></section><p class="footnote">`)};

/* 5 Reports */
const _reportsPage=reportsPage;
reportsPage=function(){const h=_reportsPage(),mark='<p class="footnote">Historical';if(!h.includes(mark))return h;return h.replace(mark,`<div class="grid2" style="margin-top:24px"><section class="panel">${panelhead('Services by date',badge('Replaces the Tab32 report + spreadsheet'))}<div class="pad" style="padding-top:0"><div class="filters"><input type="date" aria-label="From" value="2026-06-04"><input type="date" aria-label="To" value="2026-07-03"></div><table><thead><tr><th>Service</th><th>Children</th></tr></thead><tbody>${[['Screenings',384],['Cleanings',351],['Fluoride',338],['Sealants',228],['SDF',41]].map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td></tr>`).join('')}</tbody></table></div></section><section class="panel">${panelhead('Seen this week, by hygienist')}<div class="pad" style="padding-top:0">${[['Tia',42],['Heatherann',38],['Karen',31],['Lauren',22]].map(r=>`<div style="margin-bottom:18px"><div class="split small"><span>${r[0]}</span><strong>${r[1]}</strong></div><div class="progress" style="height:8px"><i style="width:${r[1]/42*100}%"></i></div></div>`).join('')}<p class="small muted">Counted from visits charted in Tab32.</p></div></section></div>`+mark)};

/* Assistant: two more things it can answer */
const _chatReply=chatReply;
chatReply=function(question){const q=question.toLowerCase();if(/birthday/.test(q))return {role:'assistant',text:'1 child at Pima could not be found with the birthday on the form. The list to take to the school office is on the AHCCCS checks tab.',source:'Pima Elementary · AHCCCS checks',action:{school:0,tab:'eligibility',label:'Open the list'}};if(/bill|claim|missed|not paid/.test(q)&&state.role==='Owner')return {role:'assistant',text:'3 children were seen but have no claim yet. 12 claims are waiting for payment, and 2 claims show the wrong hygienist.',source:'Money · Nothing missed',action:{page:'money',label:'Open Money'}};return _chatReply(question)};

/* 6 Parent form: AHCCCS question on the first step */
const _parentContent=parentContent;
parentContent=function(){let h=_parentContent();if(state.parentStep===0){const p=state.parent;h=h.replace('</div></form>',`<div><label>${tr('Does your child have AHCCCS (Medicaid)?','¿Su hijo/a tiene AHCCCS (Medicaid)?')}</label><select data-parent="ahcccs" required><option value="">${tr('Choose…','Elija…')}</option>${[tr('Yes','Sí'),'No',tr('I’m not sure','No estoy seguro/a')].map(v=>`<option ${v===p.ahcccs?'selected':''}>${v}</option>`).join('')}</select></div><div><label>${tr('AHCCCS ID, if you know it','Número de AHCCCS, si lo sabe')}</label><input data-parent="ahcccsId" value="${esc(p.ahcccsId||'')}" placeholder="A12345678" autocomplete="off"></div></div></form>`)}return h};

/* 7 Links that open a role or a page: ?role=owner|office|field  ?show=money|insurance|documents|reports|review|child|pay */
(function(){const u=new URLSearchParams(location.search),r={owner:'Owner',office:'Office',field:'Field',hygienist:'Field'}[(u.get('role')||'').toLowerCase()];if(r)state.role=r})();

/* 8 Back arrow. Nothing to go back to on the screen you started on, however you got back there. Remembers the screens (and pop-ups) you came through, shows a Back button, and follows the browser's or phone's own back button. */
let trail=[],lastLoc=null,startLoc=null,goingBack=false,resetTrail=false,modalTrail=[],modalNow=null,pendingOpen=null;
const backIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';
function locOf(){return {page:state.page,school:state.school,tab:state.tab,filter:state.filter,query:state.query,report:state.report,parentStep:state.parentStep,role:state.role}}
function modalIsOpen(){return document.getElementById('modalroot').innerHTML!==''}
function paintBack(){const bar=document.querySelector('.topbar');if(bar&&trail.length&&!bar.querySelector('.backbtn'))bar.insertAdjacentHTML('afterbegin',`<button class="backbtn" onclick="backOne()" aria-label="Go back to the last screen">${backIcon}<span>Back</span></button>`)}
function trackScreen(){const now=locOf();if(resetTrail||(lastLoc&&lastLoc.role!==now.role)){trail=[];resetTrail=false}else if(lastLoc&&!goingBack&&(lastLoc.page!==now.page||lastLoc.school!==now.school)){lastLoc.y=window.scrollY;trail.push(lastLoc);if(trail.length>30)trail.shift()}if(!startLoc)startLoc=now;if(now.page===startLoc.page&&now.school===startLoc.school)trail=[];lastLoc=now;paintBack();syncHistory()}
const _renderBack=render;render=function(){_renderBack();trackScreen()};
const _renderParentBack=renderParent;renderParent=function(){_renderParentBack();trackScreen()};
const _applySnapshotBack=applyDemoSnapshot;applyDemoSnapshot=function(snapshot){resetTrail=true;_applySnapshotBack(snapshot)};
const _modalBack=modal;modal=function(title,body,footer,drawer){
 if(modalNow&&modalIsOpen()&&!goingBack){const seen=modalTrail.findIndex(m=>m.title===title);if(seen>-1)modalTrail.length=seen;else if(modalNow.title!==title)modalTrail.push(modalNow)}
 modalNow={title,reopen:pendingOpen,args:[title,body,footer,drawer]};_modalBack(title,body,footer,drawer);
 if(modalTrail.length)document.querySelector('#modalroot .drawerhead>div')?.insertAdjacentHTML('afterbegin','<button class="back" onclick="backOne()">← Back</button>');
 syncHistory()};
const _closeModalBack=closeModal;closeModal=function(){_closeModalBack();modalTrail=[];modalNow=null;syncHistory()};
['openAdult','openAsk','openCalendar','openChild','openClaim','openDocument','openDonor','openEligibility','openFollowup','openGrant','openMissed','openPayment','openRemit','openSchoolInfo','openSearch','openSlip','openTeaching','openUpload'].forEach(n=>{const f=window[n];if(typeof f!=='function')return;window[n]=function(...a){const before=pendingOpen;pendingOpen=()=>window[n](...a);try{return f.apply(this,a)}finally{pendingOpen=before}}});
function backOne(){
 if(modalIsOpen()){const prev=modalTrail.pop();if(!prev){closeModal();return}goingBack=true;try{prev.reopen?prev.reopen():modal(...prev.args)}finally{goingBack=false}return}
 const l=trail.pop();if(!l)return;goingBack=true;try{Object.assign(state,{page:l.page,school:l.school,tab:l.tab,filter:l.filter,query:l.query,report:l.report,parentStep:l.parentStep});render()}finally{goingBack=false}window.scrollTo(0,l.y||0)}
/* Keep the browser's own back button in step: one history entry for each step you can go back. */
let histAt=0,histTimer=null,histSkip=false;
function backDepth(){return trail.length+(modalIsOpen()?modalTrail.length+1:0)}
function syncHistory(){if(embeddedPreview||histTimer)return;histTimer=setTimeout(()=>{histTimer=null;const d=backDepth();try{while(histAt<d)history.pushState({tb:++histAt},'');if(histAt>d){histSkip=true;history.go(d-histAt);histAt=d}}catch(e){}},0)}
if(!embeddedPreview){try{history.replaceState({tb:0},'')}catch(e){}window.addEventListener('popstate',e=>{if(histSkip){histSkip=false;return}histAt=(e.state&&e.state.tb)||0;let guard=40;while(backDepth()>histAt&&guard--)backOne();syncHistory()})}

if(new URLSearchParams(location.search).get('view')==='parent')state.page='parent';render();
(function(){const s=new URLSearchParams(location.search).get('show');if(!s||embeddedPreview)return;if(s==='money'||s==='reports'||s==='review'){navigate(s)}else if(s==='insurance'){openSchool(0);state.tab='eligibility';render()}else if(s==='documents'){openSchool(0);state.tab='documents';render()}else if(s==='child'){openSchool(0);openChild(0)}else if(s==='pay'){navigate('money');openPayment(0)}})();

</script></body></html>
